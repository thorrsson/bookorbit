name: Azure Infrastructure

on:
  pull_request:
    paths:
      - "infra/azure/**"
      - "scripts/azure/**"
      - "docker-compose.yml"
      - ".github/workflows/azure-infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/azure/**"
      - "scripts/azure/**"
      - "docker-compose.yml"
      - ".github/workflows/azure-infra.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install validation prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ruby ruby-minitest
          az bicep install --version v0.49.2
          echo "$HOME/.azure/bin" >> "$GITHUB_PATH"

      - name: Validate infrastructure and deployment safeguards
        run: bash scripts/azure/test.sh
